name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck web app
        run: pnpm exec turbo run lint:tsc --filter=@ston-fi/sdk-example-next-js-app

      - name: Build web app
        run: pnpm --filter @ston-fi/sdk-example-next-js-app exec next build --webpack

      - name: Build Telegram bot
        run: pnpm --filter @ston-pulse/telegram-bot build
